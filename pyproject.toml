[project]
name = "siwy-xai"
version = "0.1.0"
description = "Causal validation of explanations of LLM-generated text detectors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
    "pandas>=2.1",
    "numpy>=2.2.6",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "shap>=0.49.1",
    "captum>=0.9.0",
    "scikit-learn>=1.7.2",
    "numba>=0.57",
    "llvmlite>=0.40",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["external"]   # git submodules

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
