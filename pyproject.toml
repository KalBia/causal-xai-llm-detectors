[project]
name = "siwy-xai"
version = "0.1.0"
description = "Causal validation of explanations of LLM-generated text detectors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "typer>=0.12"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["external"]   # git submodules

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
